# infra/nginx.conf
# Serves the static frontend build and reverse-proxies /api/* to the FastAPI
# backend container, so both sit under one domain (per Deployment Plan step 4).

server {
    listen 80;
    server_name _;

    # ---- Static frontend (landing, dashboard, outreach) ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Reverse proxy to FastAPI backend ----
    # Frontend should call /api/model/slice, /api/floats/nearby, etc.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- Healthcheck passthrough ----
    location /health {
        proxy_pass http://backend:8000/health;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
